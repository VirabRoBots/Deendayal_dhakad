<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deendayal | {{file_name}}</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5d4; --violet: #9d6fff; --violet2: #7c3aed; --bg0: #04040f;
      --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.09);
      --text: #f1f5f9; --muted: #94a3b8; --r: 16px;
      --font-head: 'Space Grotesk', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg0); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%, rgba(157,111,255,.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 90%, rgba(0,245,212,.12) 0%, transparent 55%);
    }
    .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 18px; }
    .brand {
      font-family: var(--font-head); font-weight: 700; font-size: 1.25rem; text-decoration: none;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .live { font-size: .75rem; color: var(--cyan); border: 1px solid rgba(0,245,212,.35); padding: 4px 10px; border-radius: 99px; }
    .player-box {
      position: relative; border-radius: var(--r); overflow: hidden; background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 1px solid var(--border);
    }
    .plyr { --plyr-color-main: var(--violet2); }
    .plyr.controls-locked .plyr__controls,
    .plyr.controls-locked .plyr__control--overlaid {
      opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
    }
    #mediaLoadingUI {
      position: absolute; inset: 0; z-index: 9999; background: rgba(4,4,15,.9);
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #mediaLoadingUI.show { display: flex; }
    .load-ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12); border-top-color: var(--cyan);
      animation: spin .85s linear infinite;
    }
    .load-text { color: var(--muted); font-size: .9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-card {
      margin-top: 16px; background: var(--glass); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 18px;
    }
    .file-title { font-family: var(--font-head); font-weight: 600; word-break: break-word; margin-bottom: 6px; }
    .file-meta { color: var(--muted); font-size: .85rem; }
    .media-bar {
      margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--glass); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    }
    .chip {
      border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text);
      border-radius: 99px; padding: 8px 14px; font-size: .82rem; cursor: pointer;
    }
    .chip.active {
      border-color: var(--violet); color: #fff;
      background: linear-gradient(135deg, rgba(124,58,237,.45), rgba(0,245,212,.15));
    }
    #audioPanel { display: none; width: 100%; margin-top: 8px; flex-wrap: wrap; gap: 8px; }
    #audioPanel.show { display: flex; }
    .actions {
      margin-top: 14px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,.04); color: var(--text); text-decoration: none;
      font-size: .85rem; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(135deg, var(--violet2), #a855f7); border: none; }
    .btn.mx { background: linear-gradient(135deg, #1a73e8, #3b82f6); border: none; }
    .btn.vlc { background: linear-gradient(135deg, #e65100, #ff6d00); border: none; }
    .note {
      margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--cyan);
      background: rgba(0,245,212,.06); border-radius: 0 10px 10px 0;
      color: var(--muted); font-size: .82rem; line-height: 1.5;
    }
    footer { margin-top: 28px; text-align: center; color: #475569; font-size: .75rem; padding-bottom: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://t.me/Deendayal_dhakad">Deendayal Stream</a>
      <span class="live">● LIVE</span>
    </header>

    <div class="player-box">
      <video id="player" playsinline preload="metadata" controls>
        <source src="{{file_url}}">
      </video>
      <div id="mediaLoadingUI">
        <div class="load-ring"></div>
        <div class="load-text" id="mediaLoadingText">Loading…</div>
      </div>
    </div>

    <div class="file-card">
      <div class="file-title">{{file_name}}</div>
      <div class="file-meta">Size: {{file_size}}</div>
    </div>

    <div class="media-bar">
      <span style="font-size:.8rem;color:var(--muted);font-weight:600">AUDIO</span>
      <button class="chip" id="btnAudio" type="button">Tracks</button>
      <div id="audioPanel"></div>
    </div>

    <div class="actions">
      <a class="btn primary" href="{{file_url}}" download>Download</a>
      <button class="btn" type="button" id="copyBtn">Copy Link</button>
      <a class="btn mx" id="mxLink" href="#">MX</a>
      <a class="btn vlc" id="vlcLink" href="#">VLC</a>
    </div>

    <div class="note">
      Default = original sound. Other languages: full audio is prepared once (first time can be slow),
      then audio follows the video timeline. MX/VLC still best for multi-audio.
    </div>
    <footer>© Deendayal Stream</footer>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const ORIGINAL_URL = "{{file_url}}";
    const TRACK_DEFAULT = 0;
    const MAX_DRIFT = 0.25;

    let player = null;
    let activeTrackIdx = TRACK_DEFAULT;
    let activeAudio = null;
    let preparing = false;
    let audioCtx = null;
    let vidGain = null;
    let useFallbackMute = false;
    let lastSync = 0;
    let reqId = 0;

    function $(id) { return document.getElementById(id); }
    function vid() { return document.querySelector('#player'); }

    function showLoading(on, text) {
      const el = $('mediaLoadingUI');
      const t = $('mediaLoadingText');
      const p = document.querySelector('.plyr');
      if (t && text) t.textContent = text;
      if (on) {
        if (el) el.classList.add('show');
        if (p) p.classList.add('controls-locked');
      } else {
        if (el) el.classList.remove('show');
        if (p) p.classList.remove('controls-locked');
      }
    }

    function pathParts() {
      const u = new URL(ORIGINAL_URL, location.origin);
      return { u: u, parts: u.pathname.split('/').filter(Boolean) };
    }

    function buildAudioUrl(streamIndex) {
      const o = pathParts();
      o.u.pathname = '/audio/' + streamIndex + '/' + o.parts.join('/');
      return o.u.toString();
    }

    function buildTracksUrl() {
      const o = pathParts();
      o.u.pathname = '/api/tracks/' + o.parts.join('/');
      return o.u.toString();
    }

    function initGain(v) {
      if (!v || v.__gain) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { useFallbackMute = true; return; }
      try {
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const src = audioCtx.createMediaElementSource(v);
        vidGain = audioCtx.createGain();
        src.connect(vidGain);
        vidGain.connect(audioCtx.destination);
        v.__gain = true;
        vidGain.gain.value = 1;
      } catch (e) {
        useFallbackMute = true;
      }
    }

    function silenceVideo(on) {
      const v = vid();
      initGain(v);
      if (useFallbackMute) {
        if (v) v.muted = !!on;
        return;
      }
      if (vidGain) vidGain.gain.value = on ? 0 : 1;
    }

    function destroyAudio() {
      if (!activeAudio) return;
      try {
        activeAudio.pause();
        activeAudio.removeAttribute('src');
        activeAudio.load();
        activeAudio.remove();
      } catch (e) {}
      activeAudio = null;
    }

    function followVideo(force) {
      const v = vid();
      if (!v || !activeAudio || preparing) return;
      if (activeTrackIdx === TRACK_DEFAULT) return;
      if (v.paused && !force) return;
      const target = v.currentTime || 0;
      const drift = Math.abs((activeAudio.currentTime || 0) - target);
      if (force || drift > MAX_DRIFT) {
        try { activeAudio.currentTime = target; } catch (e) {}
      }
    }

    function syncPlayState() {
      const v = vid();
      if (!v || !activeAudio || preparing) return;
      if (v.paused) {
        if (!activeAudio.paused) activeAudio.pause();
      } else {
        followVideo(true);
        if (activeAudio.paused) activeAudio.play().catch(function () {});
      }
    }

    function syncVolume() {
      if (!activeAudio || !player) return;
      activeAudio.volume = player.volume;
      activeAudio.muted = player.muted;
    }

    function markChip(idx) {
      document.querySelectorAll('#audioPanel .chip').forEach(function (c) {
        c.classList.toggle('active', String(c.dataset.index) === String(idx));
      });
    }

    function switchToDefault() {
      reqId++;
      preparing = false;
      showLoading(false);
      destroyAudio();
      activeTrackIdx = TRACK_DEFAULT;
      silenceVideo(false);
      markChip(TRACK_DEFAULT);
    }

    function switchLanguage(streamIndex) {
      const v = vid();
      if (!v) return;
      streamIndex = Number(streamIndex);

      if (streamIndex === TRACK_DEFAULT) {
        switchToDefault();
        return;
      }
      if (streamIndex === activeTrackIdx && activeAudio) return;

      const wasPlaying = !v.paused;
      const my = ++reqId;
      preparing = true;
      showLoading(true, 'Preparing audio…');
      if (wasPlaying) v.pause();

      destroyAudio();
      activeTrackIdx = streamIndex;
      silenceVideo(true);
      markChip(streamIndex);

      const a = document.createElement('audio');
      a.preload = 'auto';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.src = buildAudioUrl(streamIndex);

      a.addEventListener('canplay', function onReady() {
        a.removeEventListener('canplay', onReady);
        if (my !== reqId) {
          try { a.remove(); } catch (e) {}
          return;
        }
        activeAudio = a;
        syncVolume();
        try { activeAudio.currentTime = v.currentTime || 0; } catch (e) {}
        preparing = false;
        showLoading(false);
        if (wasPlaying) {
          activeAudio.play().catch(function () {});
          v.play().catch(function () {});
        }
        followVideo(true);
      });

      a.addEventListener('error', function () {
        if (my !== reqId) return;
        preparing = false;
        showLoading(false);
        switchToDefault();
        alert('Audio track failed. Back to default.');
      });

      a.load();
    }

    const LANG = {
      eng: 'English', en: 'English', hin: 'Hindi', hi: 'Hindi',
      tam: 'Tamil', ta: 'Tamil', tel: 'Telugu', te: 'Telugu',
      mal: 'Malayalam', ml: 'Malayalam', kan: 'Kannada', kn: 'Kannada'
    };

    function trackLabel(track, idx) {
      const tags = track.tags || {};
      const lang = (tags.language || '').toLowerCase();
      let label = LANG[lang] || lang || ('Track ' + (idx + 1));
      if (idx === 0) label += ' (Default)';
      return label;
    }

    function renderTracks(tracks) {
      const panel = $('audioPanel');
      if (!panel || !tracks || tracks.length < 2) {
        $('btnAudio').style.display = 'none';
        return;
      }
      panel.innerHTML = '';
      tracks.forEach(function (track, idx) {
        const id = idx === 0 ? TRACK_DEFAULT : track.index;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (idx === 0 ? ' active' : '');
        b.dataset.index = String(id);
        b.textContent = trackLabel(track, idx);
        b.onclick = function () { switchLanguage(id); };
        panel.appendChild(b);
      });
      panel.classList.add('show');
    }

    document.addEventListener('DOMContentLoaded', function () {
      player = new Plyr('#player', {
        controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
        settings: ['speed'],
        seekTime: 10
      });

      player.on('volumechange', syncVolume);
      player.on('play', function () {
        if (preparing) { player.pause(); return; }
        syncPlayState();
      });
      player.on('pause', function () {
        if (activeAudio && !activeAudio.paused) activeAudio.pause();
      });

      const v = vid();
      if (v) {
        v.addEventListener('play', function () {
          if (preparing) { v.pause(); return; }
          syncPlayState();
        });
        v.addEventListener('pause', function () {
          if (activeAudio && !activeAudio.paused) activeAudio.pause();
        });
        v.addEventListener('seeked', function () {
          followVideo(true);
          syncPlayState();
        });
        v.addEventListener('waiting', function () {
          if (activeAudio && !activeAudio.paused) activeAudio.pause();
        });
        v.addEventListener('playing', function () { syncPlayState(); });
        v.addEventListener('timeupdate', function () {
          if (!activeAudio || preparing) return;
          const now = performance.now();
          if (now - lastSync < 300) return;
          lastSync = now;
          followVideo(false);
        });
      }

      $('btnAudio').onclick = function () {
        $('audioPanel').classList.toggle('show');
      };

      $('copyBtn').onclick = function () {
        const u = new URL(ORIGINAL_URL, location.origin).toString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(function () { alert('Copied'); });
        } else prompt('Copy:', u);
      };

      const full = new URL(ORIGINAL_URL, location.origin).toString();
      $('vlcLink').href = 'vlc://' + full;
      $('mxLink').href = 'intent://' + full.replace(/^https?:\/\//, '') +
        '#Intent;type=video/*;package=com.mxtech.videoplayer.ad;end';

      fetch(buildTracksUrl())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          const tracks = Array.isArray(data) ? data : (data.tracks || []);
          renderTracks(tracks);
        })
        .catch(function () {});
    });
  </script>
</body>
</html>
