<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deendayal | {{file_name}}</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5d4; --violet: #9d6fff; --violet2: #7c3aed; --bg0: #04040f;
      --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.09);
      --text: #f1f5f9; --muted: #94a3b8; --r: 16px;
      --font-head: 'Space Grotesk', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg0); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%, rgba(157,111,255,.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 90%, rgba(0,245,212,.12) 0%, transparent 55%);
    }
    .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 18px; }
    .brand {
      font-family: var(--font-head); font-weight: 700; font-size: 1.25rem; text-decoration: none;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .live { font-size: .75rem; color: var(--cyan); border: 1px solid rgba(0,245,212,.35); padding: 4px 10px; border-radius: 99px; }
    .player-box {
      position: relative; border-radius: var(--r); overflow: hidden; background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 1px solid var(--border);
    }
    .plyr { --plyr-color-main: var(--violet2); }
    .plyr.controls-locked .plyr__controls,
    .plyr.controls-locked .plyr__control--overlaid {
      opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
    }
    #mediaLoadingUI {
      position: absolute; inset: 0; z-index: 9999; background: rgba(4,4,15,.9);
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #mediaLoadingUI.show { display: flex; }
    .load-ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12); border-top-color: var(--cyan);
      animation: spin .85s linear infinite;
    }
    .load-text { color: var(--muted); font-size: .9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .timeline {
      margin-top: 12px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
    }
    .tl-track {
      position: relative; height: 22px; display: flex; align-items: center; cursor: pointer;
      touch-action: none; user-select: none;
    }
    .tl-rail {
      position: absolute; left: 0; right: 0; height: 6px; border-radius: 99px;
      background: rgba(255,255,255,.10);
    }
    .tl-fill {
      position: absolute; left: 0; height: 6px; border-radius: 99px; width: 0%;
      background: linear-gradient(90deg, var(--violet2), var(--cyan));
    }
    .tl-knob {
      position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(124,58,237,.35); left: 0; transform: translateX(-50%);
      pointer-events: none;
    }
    .tl-times {
      display: flex; justify-content: space-between; margin-top: 8px;
      font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .file-card {
      margin-top: 16px; background: var(--glass); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 18px;
    }
    .file-title { font-family: var(--font-head); font-weight: 600; word-break: break-word; margin-bottom: 6px; }
    .file-meta { color: var(--muted); font-size: .85rem; }
    .media-bar {
      margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--glass); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    }
    .chip {
      border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text);
      border-radius: 99px; padding: 8px 14px; font-size: .82rem; cursor: pointer;
    }
    .chip.active {
      border-color: var(--violet); color: #fff;
      background: linear-gradient(135deg, rgba(124,58,237,.45), rgba(0,245,212,.15));
    }
    #audioPanel { display: none; width: 100%; margin-top: 8px; flex-wrap: wrap; gap: 8px; }
    #audioPanel.show { display: flex; }
    .actions {
      margin-top: 14px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,.04); color: var(--text); text-decoration: none;
      font-size: .85rem; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(135deg, var(--violet2), #a855f7); border: none; }
    .btn.mx { background: linear-gradient(135deg, #1a73e8, #3b82f6); border: none; }
    .btn.vlc { background: linear-gradient(135deg, #e65100, #ff6d00); border: none; }
    .note {
      margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--cyan);
      background: rgba(0,245,212,.06); border-radius: 0 10px 10px 0;
      color: var(--muted); font-size: .82rem; line-height: 1.5;
    }
    footer { margin-top: 28px; text-align: center; color: #475569; font-size: .75rem; padding-bottom: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://t.me/Deendayal_dhakad">Deendayal Stream</a>
      <span class="live">● LIVE</span>
    </header>

    <div class="player-box">
      <video id="player" playsinline preload="metadata" controls>
        <source src="{{file_url}}">
      </video>
      <div id="mediaLoadingUI">
        <div class="load-ring"></div>
        <div class="load-text" id="mediaLoadingText">Loading…</div>
      </div>
    </div>

    <div class="timeline">
      <div class="tl-track" id="tlTrack">
        <div class="tl-rail"></div>
        <div class="tl-fill" id="tlFill"></div>
        <div class="tl-knob" id="tlKnob"></div>
      </div>
      <div class="tl-times">
        <span id="tlCurrent">0:00</span>
        <span id="tlDuration">--:--</span>
      </div>
    </div>

    <div class="file-card">
      <div class="file-title">{{file_name}}</div>
      <div class="file-meta" id="fileMeta">Size: {{file_size}}</div>
    </div>

    <div class="media-bar">
      <span style="font-size:.8rem;color:var(--muted);font-weight:600">AUDIO</span>
      <button class="chip" id="btnAudio" type="button">Tracks</button>
      <div id="audioPanel"></div>
    </div>

    <div class="actions">
      <a class="btn primary" href="{{file_url}}" download>Download</a>
      <button class="btn" type="button" id="copyBtn">Copy Link</button>
      <a class="btn mx" id="mxLink" href="#">MX</a>
      <a class="btn vlc" id="vlcLink" href="#">VLC</a>
    </div>

    <div class="note">
      Default = original file. Other languages = live video+audio from current time (video copied, not re-encoded).
      No disk cache. Use the bar above to seek on any track.
    </div>
    <footer>© Deendayal Stream</footer>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const ORIGINAL_URL = "{{file_url}}";
    const TRACK_DEFAULT = 0;

    let player = null;
    let activeTrackIdx = TRACK_DEFAULT;
    let segmentStart = 0;
    let totalDuration = 0;
    let loadToken = 0;
    let preparing = false;
    let dragging = false;
    let dragValue = 0;
    let timelineFrame = 0;
    let seekTimer = null;

    function $(id) { return document.getElementById(id); }
    function vid() { return document.querySelector('#player'); }

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return '--:--';
      sec = Math.floor(sec);
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      var mm = (h > 0 && m < 10) ? '0' + m : String(m);
      return (h > 0 ? h + ':' : '') + mm + ':' + (s < 10 ? '0' + s : s);
    }

    function showLoading(on, text) {
      var el = $('mediaLoadingUI');
      var t = $('mediaLoadingText');
      var p = document.querySelector('.plyr');
      if (t && text) t.textContent = text;
      if (on) {
        if (el) el.classList.add('show');
        if (p) p.classList.add('controls-locked');
      } else {
        if (el) el.classList.remove('show');
        if (p) p.classList.remove('controls-locked');
      }
    }

    function ensureDuration() {
      if (totalDuration > 0) return;
      var v = vid();
      if (v && isFinite(v.duration) && v.duration > 0) {
        totalDuration = v.duration;
      }
    }

    function movieTime() {
  var v = vid();
  if (!v) return 0;
  if (activeTrackIdx === TRACK_DEFAULT) {
    return v.currentTime || 0;
  } else {
    return segmentStart + (v.currentTime || 0);
  }
}

    function pathParts() {
      var u = new URL(ORIGINAL_URL, location.origin);
      return { u: u, parts: u.pathname.split('/').filter(Boolean) };
    }

    function buildMuxUrl(streamIndex, atTime) {
      var o = pathParts();
      o.u.pathname = '/mux/' + streamIndex + '/' + o.parts.join('/');
      if (atTime > 0) o.u.searchParams.set('t', String(Math.floor(atTime)));
      o.u.searchParams.set('_', String(Date.now()));
      return o.u.toString();
    }

    function buildTracksUrl() {
      var o = pathParts();
      o.u.pathname = '/api/tracks/' + o.parts.join('/');
      return o.u.toString();
    }

    function renderTimeline() {
      ensureDuration();
      var dur = totalDuration;
      var cur = dragging ? dragValue : movieTime();
      if (dur > 0) cur = Math.min(Math.max(0, cur), dur);
      var pct = dur > 0 ? (cur / dur) * 100 : 0;
      $('tlFill').style.width = pct + '%';
      $('tlKnob').style.left = pct + '%';
      $('tlCurrent').textContent = fmt(cur);
      $('tlDuration').textContent = fmt(dur);
    }
    
function updateTimelineLoop() {
  renderTimeline();
  timelineFrame = requestAnimationFrame(updateTimelineLoop);
}

    function loadSource(url, baseTime, wasPlaying, label) {
      var v = vid();
      if (!v) return;
      var token = ++loadToken;
      preparing = true;
      segmentStart = baseTime || 0;
      showLoading(true, label || 'Loading…');
      try { v.pause(); } catch (e) {}

      v.addEventListener('loadedmetadata', function onMeta() {
  if (token !== loadToken) return;
  v.removeEventListener('loadedmetadata', onMeta);
  preparing = false;
  showLoading(false);
  
  // Set current time to baseTime (where you were) instead of 0
  try { 
    v.currentTime = baseTime; 
  } catch (e) {}
  
  renderTimeline();
  if (wasPlaying) v.play().catch(function () {});
});

      if (player) {
        if (activeTrackIdx === TRACK_DEFAULT) {
          player.source = { type: 'video', sources: [{ src: url }] };
        } else {
          player.source = { type: 'video', sources: [{ src: url, type: 'video/mp4' }] };
        }
      } else {
        v.src = url;
        v.load();
      }

      setTimeout(function () {
        if (token === loadToken) {
          preparing = false;
          showLoading(false);
        }
      }, 120000);
    }

    function seekTo(time) {
  var v = vid();
  if (!v) return;
  ensureDuration();
  if (totalDuration > 0) {
    time = Math.max(0, Math.min(time, totalDuration - 0.5));
  } else {
    time = Math.max(0, time);
  }
  var wasPlaying = !v.paused;

  if (activeTrackIdx === TRACK_DEFAULT) {
    segmentStart = 0;
    if (String(v.currentSrc || v.src || '').indexOf('/mux/') !== -1) {
      loadSource(ORIGINAL_URL, 0, wasPlaying, 'Loading…');
      var once = function () {
        v.removeEventListener('loadedmetadata', once);
        try { v.currentTime = time; } catch (e) {}
        renderTimeline();
      };
      v.addEventListener('loadedmetadata', once);
      return;
    }
    try { v.currentTime = time; } catch (e) {}
    if (wasPlaying) v.play().catch(function () {});
    renderTimeline();
    return;
  }

  // For non-default tracks: reload mux from new time
  loadSource(buildMuxUrl(activeTrackIdx, time), time, wasPlaying, 'Seeking…');
    }
    
    function switchLanguage(streamIndex) {
      var v = vid();
      if (!v || preparing) return;
      streamIndex = Number(streamIndex);
      if (streamIndex === activeTrackIdx) return;

      ensureDuration();
      var wasPlaying = !v.paused;
      var t = movieTime();
      activeTrackIdx = streamIndex;
      markChip(streamIndex);

      if (streamIndex === TRACK_DEFAULT) {
        loadSource(ORIGINAL_URL, 0, wasPlaying, 'Loading…');
        var once = function () {
          v.removeEventListener('loadedmetadata', once);
          try {
            if (t > 0) {
              var cap = (isFinite(v.duration) && v.duration > 0) ? v.duration - 0.3 : t;
              v.currentTime = Math.min(t, Math.max(0, cap));
            }
          } catch (e) {}
          renderTimeline();
        };
        v.addEventListener('loadedmetadata', once);
        return;
      }

      loadSource(buildMuxUrl(streamIndex, t), t, wasPlaying, 'Switching audio…');
    }

    function markChip(idx) {
      document.querySelectorAll('#audioPanel .chip').forEach(function (c) {
        c.classList.toggle('active', String(c.dataset.index) === String(idx));
      });
    }

    var LANG = {
      eng: 'English', en: 'English', hin: 'Hindi', hi: 'Hindi',
      tam: 'Tamil', ta: 'Tamil', tel: 'Telugu', te: 'Telugu',
      mal: 'Malayalam', ml: 'Malayalam', kan: 'Kannada', kn: 'Kannada'
    };

    function trackLabel(track, idx) {
      var tags = track.tags || {};
      var lang = (tags.language || '').toLowerCase();
      var label = LANG[lang] || lang || ('Track ' + (idx + 1));
      if (idx === 0) label += ' (Default)';
      return label;
    }

    function renderTracks(tracks) {
      var panel = $('audioPanel');
      if (!panel || !tracks || tracks.length < 2) {
        $('btnAudio').style.display = 'none';
        return;
      }
      panel.innerHTML = '';
      tracks.forEach(function (track, idx) {
        var id = idx === 0 ? TRACK_DEFAULT : track.index;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (idx === 0 ? ' active' : '');
        b.dataset.index = String(id);
        b.textContent = trackLabel(track, idx);
        b.onclick = function () { switchLanguage(id); };
        panel.appendChild(b);
      });
      panel.classList.add('show');
    }

    function pointerTime(clientX) {
      var rect = $('tlTrack').getBoundingClientRect();
      var r = rect.width > 0 ? (clientX - rect.left) / rect.width : 0;
      r = Math.max(0, Math.min(1, r));
      return (totalDuration > 0 ? totalDuration : 0) * r;
    }

    document.addEventListener('DOMContentLoaded', function () {
      player = new Plyr('#player', {
        controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen'],
        settings: ['speed'],
        seekTime: 10
      });

      var v = vid();
      updateTimelineLoop();
      
      if (v) {
        v.addEventListener('loadedmetadata', function () {
          if (isFinite(v.duration) && v.duration > 0) {
            if (activeTrackIdx === TRACK_DEFAULT || !totalDuration) {
              totalDuration = v.duration;
            }
          }
          renderTimeline();
        });
        v.addEventListener('timeupdate', renderTimeline);
        v.addEventListener('waiting', function () {
          if (!preparing) showLoading(true, 'Buffering…');
        });
        ['playing', 'canplay', 'loadeddata'].forEach(function (ev) {
          v.addEventListener(ev, function () {
            if (!preparing) showLoading(false);
          });
        });
      }

      var track = $('tlTrack');
      track.addEventListener('pointerdown', function (e) {
        ensureDuration();
        if (!totalDuration) return;
        track.setPointerCapture(e.pointerId);
        dragging = true;
        dragValue = pointerTime(e.clientX);
        renderTimeline();
      });
      track.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        dragValue = pointerTime(e.clientX);
        renderTimeline();
      });
      track.addEventListener('pointerup', function () {
        if (!dragging) return;
        dragging = false;
        if (seekTimer) clearTimeout(seekTimer);
        var t = dragValue;
        seekTimer = setTimeout(function () { seekTo(t); }, 150);
      });
      track.addEventListener('pointercancel', function () { dragging = false; });

      $('btnAudio').onclick = function () {
        $('audioPanel').classList.toggle('show');
      };
      $('copyBtn').onclick = function () {
        var u = new URL(ORIGINAL_URL, location.origin).toString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(function () { alert('Copied'); });
        } else prompt('Copy:', u);
      };

      var full = new URL(ORIGINAL_URL, location.origin).toString();
      $('vlcLink').href = 'vlc://' + full;
      $('mxLink').href = 'intent://' + full.replace(/^https?:\/\//, '') +
        '#Intent;type=video/*;package=com.mxtech.videoplayer.ad;end';

      fetch(buildTracksUrl())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var tracks = Array.isArray(data) ? data : (data.tracks || []);
          var dur = data && data.duration ? Number(data.duration) : 0;
          if (dur > 0) totalDuration = dur;
          renderTracks(tracks);
          if (totalDuration > 0) {
            var meta = $('fileMeta');
            if (meta && !meta.dataset.dur) {
              meta.dataset.dur = '1';
              meta.textContent += ' · ' + fmt(totalDuration);
            }
          }
          renderTimeline();
        })
        .catch(function () {});
    });
  </script>
</body>
</html>
