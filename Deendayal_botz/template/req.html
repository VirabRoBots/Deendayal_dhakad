<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deendayal | {{file_name}}</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5d4;
      --violet: #9d6fff;
      --violet2: #7c3aed;
      --bg0: #04040f;
      --bg1: #08081a;
      --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.09);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --r: 16px;
      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg0);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%, rgba(157,111,255,.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 90%, rgba(0,245,212,.12) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0 18px;
    }
    .brand {
      font-family: var(--font-head); font-weight: 700; font-size: 1.25rem;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .live {
      font-size: 0.75rem; color: var(--cyan);
      border: 1px solid rgba(0,245,212,.35);
      padding: 4px 10px; border-radius: 99px;
    }

    .player-box {
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
      border: 1px solid var(--border);
    }
    .plyr { --plyr-color-main: var(--violet2); }
    .plyr.controls-locked .plyr__controls,
    .plyr.controls-locked .plyr__control--overlaid {
      opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
    }

    #mediaLoadingUI {
      position: absolute; inset: 0; z-index: 9999;
      background: rgba(4,4,15,.9);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; pointer-events: all;
    }
    #mediaLoadingUI.show { display: flex; }
    .load-ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--cyan);
      animation: spin .85s linear infinite;
    }
    .load-text { color: var(--muted); font-size: .9rem; font-weight: 500; letter-spacing: .5px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .file-card {
      margin-top: 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px 18px;
      backdrop-filter: blur(10px);
    }
    .file-title {
      font-family: var(--font-head); font-weight: 600; font-size: 1rem;
      line-height: 1.4; word-break: break-word; margin-bottom: 6px;
    }
    .file-meta { color: var(--muted); font-size: .85rem; }

    .media-bar {
      margin-top: 14px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
    }
    .media-bar .label {
      font-size: .8rem; color: var(--muted); font-weight: 600;
      letter-spacing: .4px; margin-right: 4px;
    }
    .chip {
      border: 1px solid var(--border); background: rgba(255,255,255,.04);
      color: var(--text); border-radius: 99px; padding: 8px 14px;
      font-size: .82rem; font-weight: 500; cursor: pointer;
      transition: .15s ease;
    }
    .chip:hover { border-color: rgba(157,111,255,.45); background: rgba(157,111,255,.12); }
    .chip.active {
      border-color: var(--violet); color: #fff;
      background: linear-gradient(135deg, rgba(124,58,237,.45), rgba(0,245,212,.15));
    }
    #audioPanel { display: none; width: 100%; margin-top: 8px; }
    #audioPanel.show { display: flex; flex-wrap: wrap; gap: 8px; }

    .actions {
      margin-top: 14px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,.04); color: var(--text);
      text-decoration: none; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: .15s ease;
    }
    .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.08); }
    .btn.primary {
      background: linear-gradient(135deg, var(--violet2), #a855f7);
      border-color: transparent;
    }
    .btn.mx { background: linear-gradient(135deg, #1a73e8, #3b82f6); border: none; }
    .btn.vlc { background: linear-gradient(135deg, #e65100, #ff6d00); border: none; }
    .btn.playit { background: linear-gradient(135deg, #7c3aed, #a855f7); border: none; }

    .note {
      margin-top: 16px; padding: 12px 14px;
      border-left: 3px solid var(--cyan);
      background: rgba(0,245,212,.06); border-radius: 0 10px 10px 0;
      color: var(--muted); font-size: .82rem; line-height: 1.5;
    }
    footer {
      margin-top: 28px; text-align: center; color: #475569; font-size: .75rem; padding-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://t.me/Deendayal_dhakad">Deendayal Stream</a>
      <span class="live">● LIVE</span>
    </header>

    <div class="player-box">
      <video id="player" playsinline preload="metadata" controls>
        <source src="{{file_url}}">
      </video>
      <div id="mediaLoadingUI">
        <div class="load-ring"></div>
        <div class="load-text" id="mediaLoadingText">Loading…</div>
      </div>
    </div>

    <div class="file-card">
      <div class="file-title">{{file_name}}</div>
      <div class="file-meta">Size: {{file_size}}</div>
    </div>

    <div class="media-bar">
      <span class="label"><i class="fa-solid fa-sliders"></i> MEDIA</span>
      <button class="chip" id="btnAudio" type="button"><i class="fa-solid fa-music"></i> Audio</button>
      <div id="audioPanel"></div>
    </div>

    <div class="actions">
      <a class="btn primary" href="{{file_url}}" download><i class="fa-solid fa-download"></i> Download</a>
      <button class="btn" type="button" onclick="copyLink()"><i class="fa-solid fa-link"></i> Copy Link</button>
      <a class="btn mx" id="mxLink" href="#"><i class="fa-solid fa-play"></i> MX</a>
      <a class="btn vlc" id="vlcLink" href="#"><i class="fa-solid fa-play"></i> VLC</a>
      <a class="btn playit" id="playitLink" href="#"><i class="fa-solid fa-play"></i> PlayIt</a>
    </div>

    <div class="note">
      Changing audio track will restart the video from the beginning so audio and video stay perfectly in sync.
    </div>

    <footer>© Deendayal Stream · For personal use only</footer>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const STREAM_URL = "{{file_url}}";
    const SEEK_BUCKET_SECONDS = 10;

    let player = null;
    let activeTrackIdx = null;
    let isPreparing = false;
    let wantPlayWhenReady = false;
    let buffering = false;
    let seekDebounceTimer = null;
    let suppressNextSeekedEvent = false;

    function buildVideoTrackUrl(streamIndex, atTime) {
      const u = new URL(STREAM_URL, window.location.origin);
      const pathParts = u.pathname.split('/').filter(Boolean);
      u.pathname = '/video-track/' + streamIndex + '/' + pathParts.join('/');
      u.searchParams.set('t', String(Math.max(0, atTime || 0)));
      return u.toString();
    }

    function buildTracksUrl() {
      const u = new URL(STREAM_URL, window.location.origin);
      const pathParts = u.pathname.split('/').filter(Boolean);
      u.pathname = '/api/tracks/' + pathParts.join('/');
      return u.toString();
    }

    const LANG_MAP = {
      eng:'English', en:'English', hin:'Hindi', hi:'Hindi',
      tam:'Tamil', ta:'Tamil', tel:'Telugu', te:'Telugu',
      mal:'Malayalam', ml:'Malayalam', kan:'Kannada', kn:'Kannada',
      ben:'Bengali', bn:'Bengali', pan:'Punjabi', pa:'Punjabi'
    };

    function trackLabel(track, idx) {
      const meta = track.tags || {};
      const lang = (meta.language || '').toLowerCase();
      const title = meta.title || '';
      let label = LANG_MAP[lang] || lang || ('Track ' + (idx + 1));
      if (idx === 0) label += ' (Default)';
      if (title && title.length < 40) label += ' — ' + title;
      return label;
    }

    function getVideo() {
      return document.querySelector('#player');
    }

    function showLoadingUI(show, text) {
      const el = document.getElementById('mediaLoadingUI');
      const txt = document.getElementById('mediaLoadingText');
      const plyrEl = document.querySelector('.plyr');
      if (txt && text) txt.textContent = text;
      if (show) {
        if (el) el.classList.add('show');
        if (plyrEl) plyrEl.classList.add('controls-locked');
      } else {
        if (el) el.classList.remove('show');
        if (plyrEl) plyrEl.classList.remove('controls-locked');
      }
    }

    function updateLoadingUI() {
      if (isPreparing) {
        showLoadingUI(true, 'Preparing…');
        return;
      }
      if (buffering) {
        showLoadingUI(true, 'Loading…');
        return;
      }
      showLoadingUI(false);
    }

    function setPreparing(on) {
      isPreparing = on;
      updateLoadingUI();
    }

    function markActiveChip(streamIndex) {
      document.querySelectorAll('#audioPanel .chip').forEach(function (el) {
        el.classList.toggle('active', String(el.dataset.index) === String(streamIndex == null ? 'default' : streamIndex));
      });
    }

    // Always start from 00:00:00 when changing audio track
    function requestTrack(streamIndex) {
      const vid = getVideo();
      if (!vid) return;

      const wasPlaying = !vid.paused;

      activeTrackIdx = streamIndex;
      wantPlayWhenReady = wasPlaying;
      setPreparing(true);

      suppressNextSeekedEvent = true;
      vid.src = buildVideoTrackUrl(streamIndex, 0);  // always from beginning
      vid.load();

      vid.addEventListener('loadedmetadata', function onReady() {
        vid.removeEventListener('loadedmetadata', onReady);
        setPreparing(false);
        markActiveChip(streamIndex);
        if (wantPlayWhenReady) {
          wantPlayWhenReady = false;
          vid.play().catch(function () {});
        }
      }, { once: true });

      vid.addEventListener('error', function onErr() {
        vid.removeEventListener('error', onErr);
        setPreparing(false);
        wantPlayWhenReady = false;
        alert('Selected audio track failed. Switched back to default.');
        switchToDefault();
      }, { once: true });
    }

    function switchToDefault() {
      const vid = getVideo();
      const wasPlaying = vid && !vid.paused;

      activeTrackIdx = null;
      wantPlayWhenReady = wasPlaying;
      setPreparing(true);

      suppressNextSeekedEvent = true;
      vid.src = STREAM_URL;
      vid.load();

      vid.addEventListener('loadedmetadata', function onReady() {
        vid.removeEventListener('loadedmetadata', onReady);
        setPreparing(false);
        markActiveChip(null);
        if (wantPlayWhenReady) {
          wantPlayWhenReady = false;
          vid.play().catch(function () {});
        }
      }, { once: true });
    }

    // When user seeks while on non-default track
    function onSeekWhileActive() {
      if (activeTrackIdx === null) return;
      if (suppressNextSeekedEvent) {
        suppressNextSeekedEvent = false;
        return;
      }

      if (seekDebounceTimer) clearTimeout(seekDebounceTimer);
      seekDebounceTimer = setTimeout(function () {
        const vid = getVideo();
        if (!vid || activeTrackIdx === null) return;

        const newTime = vid.currentTime || 0;
        requestTrackFromTime(activeTrackIdx, newTime);
      }, 450);
    }

    function requestTrackFromTime(streamIndex, atTime) {
      const vid = getVideo();
      if (!vid) return;

      const wasPlaying = !vid.paused;
      activeTrackIdx = streamIndex;
      wantPlayWhenReady = wasPlaying;
      setPreparing(true);

      suppressNextSeekedEvent = true;
      vid.src = buildVideoTrackUrl(streamIndex, atTime);
      vid.load();

      vid.addEventListener('loadedmetadata', function onReady() {
        vid.removeEventListener('loadedmetadata', onReady);
        setPreparing(false);
        markActiveChip(streamIndex);
        if (wantPlayWhenReady) {
          wantPlayWhenReady = false;
          vid.play().catch(function () {});
        }
      }, { once: true });
    }

    function renderAudioPanel(tracks) {
      const panel = document.getElementById('audioPanel');
      if (!panel || !tracks || tracks.length < 2) {
        document.getElementById('btnAudio').style.display = 'none';
        return;
      }
      panel.innerHTML = '';
      tracks.forEach(function (track, idx) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (idx === 0 ? ' active' : '');
        b.dataset.index = idx === 0 ? 'default' : track.index;
        b.textContent = trackLabel(track, idx);

        b.onclick = function () {
          if (idx === 0) {
            switchToDefault();
          } else {
            requestTrack(track.index);  // always starts from 00:00:00
          }
        };
        panel.appendChild(b);
      });
    }

    document.getElementById('btnAudio').addEventListener('click', function () {
      document.getElementById('audioPanel').classList.toggle('show');
    });

    (function () {
      const intent = 'intent://' + STREAM_URL.replace(/^https?:\/\//, '') + '#Intent;type=video/*;';
      document.getElementById('vlcLink').href = 'vlc://' + STREAM_URL;
      document.getElementById('mxLink').href = intent + 'package=com.mxtech.videoplayer.ad;end';
      document.getElementById('playitLink').href = intent + 'package=com.jio.media.jiobeats;end';
    })();

    function copyLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(STREAM_URL).then(function () {
          alert('Link copied!');
        }).catch(function () {
          prompt('Copy this link:', STREAM_URL);
        });
      } else {
        prompt('Copy this link:', STREAM_URL);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      showLoadingUI(true, 'Loading…');

      player = new Plyr('#player', {
        controls: ['play-large','rewind','play','fast-forward','progress','current-time','duration','mute','volume','settings','fullscreen'],
        settings: ['speed'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
        seekTime: 10
      });

      fetch(buildTracksUrl())
        .then(function (r) { return r.json(); })
        .then(function (tracks) {
          if (Array.isArray(tracks) && tracks.length) {
            renderAudioPanel(tracks);
          }
        })
        .catch(function () {});

      const vid = getVideo();
      if (vid) {
        ['loadstart','waiting','stalled'].forEach(function (ev) {
          vid.addEventListener(ev, function () {
            buffering = true;
            updateLoadingUI();
          });
        });
        ['canplay','playing','loadeddata'].forEach(function (ev) {
          vid.addEventListener(ev, function () {
            buffering = false;
            updateLoadingUI();
          });
        });

        vid.addEventListener('seeked', function () {
          onSeekWhileActive();
        });
      }
    });
  </script>
</body>
</html>
